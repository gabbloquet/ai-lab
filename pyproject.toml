[project]
name = "ai-lab"
version = "0.1.0"
description = "Laboratoire d'AI engineering : expériences mesurées et reproductibles"
requires-python = ">=3.13"
dependencies = [
    # Rédacteur du golden set rag-qa (domains/droit-consommation) ; déjà tiré par Pydantic AI.
    "anthropic==2.4.0",
    "ailab-evals",
    "ailab-rag",
    "exp001-agent",
    "exp001-mcp-server",
    "exp002-rag",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# Racine du workspace : elle n'est pas un paquet installable.
package = false

[tool.uv.sources]
ailab-evals = { workspace = true }
ailab-rag = { workspace = true }
exp001-agent = { workspace = true }
exp001-mcp-server = { workspace = true }
exp002-rag = { workspace = true }

[tool.uv.workspace]
members = [
    "evals/python",
    "rag/python",
    "experiments/001-mcp-outils-par-intention/python/agent",
    "experiments/001-mcp-outils-par-intention/python/mcp_server",
    "experiments/002-rag-naif-vs-modele-seul/python",
]

[tool.pytest.ini_options]
testpaths = ["domains", "evals", "experiments", "rag"]
pythonpath = ["domains/magasin", "domains/droit-consommation"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Paquets du workspace : ruff ne les trouve pas seul, ils vivent sous experiments/.
known-first-party = ["ailab_evals", "ailab_rag", "exp001_agent", "exp001_mcp_server", "exp002_rag"]

[tool.mypy]
# Vérifie que les adaptateurs du jumeau respectent les ports (typing.Protocol) du domaine.
python_version = "3.13"
files = ["experiments/001-mcp-outils-par-intention/python/mcp_server/src"]
strict = true
