[project]
name = "exp005-rag"
version = "0.1.0"
description = "Expérience 005 : RAG à 20 passages (A) contre 50 candidats reclassés par Cohere, 5 envoyés (B)"
requires-python = ">=3.13"
dependencies = [
    "ailab-evals",
    # Briques RAG partagées par la série : recherche, reclassement, campagne, ligne de commande.
    "ailab-rag",
    "langfuse==5.1.0",
    "pydantic-ai-slim[google,mistral]==2.65.0",
]

[tool.uv.sources]
ailab-evals = { workspace = true }
ailab-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
