server:
  # En local, la spec MCP recommande d'écouter sur localhost uniquement (risque de DNS rebinding).
  address: 127.0.0.1
  port: 8080

spring:
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: magasin-mcp
        version: 0.1.0
        protocol: STREAMABLE

lab:
  mcp:
    # Origines navigateur acceptées (la spec MCP impose un 403 sinon). Une requête sans Origin passe.
    allowed-origins:
      - http://localhost:*
      - http://127.0.0.1:*
